<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tallow Point — an open-city crime story</title>
<meta name="description" content="Tallow Point: an original top-down open-world crime game in the browser. Five jobs, five stars, one bay.">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0a0d18;
    color: #f3f0e6;
    font-family: "Sora", "Trebuchet MS", system-ui, sans-serif;
    cursor: crosshair;
    user-select: none;
  }
  canvas { display: block; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud, #menu { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #menu { pointer-events: auto; cursor: pointer; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0a0d18; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
    color: #ffc94a; transition: opacity 0.4s ease;
  }
</style>
</head>
<body>
<div id="boot">Tallow Point</div>
<canvas id="game" aria-label="Tallow Point: the 3D city, its traffic and the chase camera" role="img"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const boot = document.getElementById('boot');
      if (boot) boot.style.opacity = '0';
      setTimeout(() => boot && boot.remove(), 500);
    }, 120);
  });
</script>
</body>
</html>
